<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1.0, viewport-fit=cover maximum-scale=1.0, user-scalable=no"
		/>
		<title>Astraler HR</title>

		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-title" content="Astraler HR" />
		<meta name="apple-mobile-web-app-status-bar-style" content="white" />
		<!-- required for setting the status bar bg as white -->
		<meta name="theme-color" content="#fff" />

		<!-- PWA -->
		<link
			rel="icon"
			type="image/png"
			sizes="196x196"
			href="/assets/hrms/manifest/astraler-hr-favicon-196.png"
		/>
		<link
			rel="apple-touch-icon"
			href="/assets/hrms/manifest/apple-icon-180.png"
		/>

		<link
			rel="apple-touch-startup-image"
			href="/assets/hrms/manifest/apple-splash.png"
			media="(device-width: 2732px) and (device-height: 2048px) and (-webkit-device-pixel-ratio: 2) and (orientation: landscape)"
		/>
		<link
			rel="apple-touch-startup-image"
			href="/assets/hrms/manifest/apple-splash.png"
			media="(device-width: 2048px) and (device-height: 2732px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)"
		/>
		<link
			rel="apple-touch-startup-image"
			href="/assets/hrms/manifest/apple-splash.png"
			media="(device-width: 1668px) and (device-height: 2388px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)"
		/>
		<link
			rel="apple-touch-startup-image"
			href="/assets/hrms/manifest/apple-splash.png"
			media="(device-width: 1668px) and (device-height: 2224px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)"
		/>
		<link
			rel="apple-touch-startup-image"
			href="/assets/hrms/manifest/apple-splash.png"
			media="(device-width: 1536px) and (device-height: 2048px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)"
		/>
		<link
			rel="apple-touch-startup-image"
			href="/assets/hrms/manifest/apple-splash.png"
			media="(device-width: 1125px) and (device-height: 2436px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)"
		/>
		<link
			rel="apple-touch-startup-image"
			href="/assets/hrms/manifest/apple-splash.png"
			media="(device-width: 1242px) and (device-height: 2688px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)"
		/>
		<link
			rel="apple-touch-startup-image"
			href="/assets/hrms/manifest/apple-splash.png"
			media="(device-width: 828px) and (device-height: 1792px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)"
		/>
		<link
			rel="apple-touch-startup-image"
			href="/assets/hrms/manifest/apple-splash.png"
			media="(device-width: 750px) and (device-height: 1334px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)"
		/>
		<link
			rel="apple-touch-startup-image"
			href="/assets/hrms/manifest/apple-splash.png"
			media="(device-width: 640px) and (device-height: 1136px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)"
		/>
	</head>
	<body class="antialiased">
		<div id="app"></div>
		<div id="modals"></div>
		<div id="popovers"></div>

		<script>
			window.csrf_token = "{{ csrf_token }}"
			window.site_name = '{{ site_name }}'
			if (!window.frappe) window.frappe = {}
			frappe.boot = {{ boot }}
		</script>

		<script type="module" src="/src/main.js"></script>
	</body>
</html>
